<!DOCTYPE html>
<html>
<head>
    <title>Smart Dispatch</title>
    <!-- Use local copy of Tailwind CSS -->
    <script src="../lib/tailwindcss.js"></script>
    <style>
        body { width: 400px; padding: 1rem; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <h1 class="text-xl font-bold mb-4 bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-purple-600">Smart Dispatch</h1>
    <p class="text-sm text-gray-600 mb-4">Register contextual assets (files/links). They are processed locally and securely on-device using pure semantic intents.</p>
    
    <form id="assetForm" class="space-y-3 bg-white p-4 rounded shadow-sm border border-gray-200">
        <div>
            <label class="block text-xs font-semibold mb-1">Label / Title</label>
            <input type="text" id="label" required class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="e.g. Q3 Report">
        </div>
        <div>
            <label class="block text-xs font-semibold mb-1">Keywords / Context</label>
            <input type="text" id="keywords" required class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="e.g. latest financial figures, presentation">
        </div>
        <div>
            <label class="block text-xs font-semibold mb-1">URL / Path</label>
            <input type="text" id="url" required class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="https://docs.google.com/...">
        </div>
        <div>
            <label class="block text-xs font-semibold mb-1">Type</label>
            <select id="type" class="w-full border rounded p-2 text-sm">
                <option value="link">Link</option>
                <option value="file">File</option>
            </select>
        </div>
        <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-semibold py-2 rounded shadow hover:bg-blue-700 transition">
            Add Asset
        </button>
        <p id="status" class="text-xs text-center text-gray-500 hidden mt-2"></p>
    </form>
    
    <hr class="my-6 border-gray-200">
    
    <h2 class="text-sm font-bold mb-2 text-gray-800">Saved Assets</h2>
    <div id="assetsList" class="space-y-2 max-h-48 overflow-y-auto">
        <p class="text-xs text-gray-500 italic">Loading...</p>
    </div>

    <script src="popup.js"></script>
</body>
</html>
